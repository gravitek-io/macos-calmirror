name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include personal calendar data
        (event titles, attendees) in the report. Redact command output if
        needed.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a rule from ... to ...
        2. Run `calmirror sync`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CalMirror version
      description: Output of `calmirror version`
      placeholder: calmirror 1.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: accounts
    attributes:
      label: Calendar account types involved
      multiple: true
      options:
        - iCloud
        - Google
        - Microsoft 365 / Outlook.com
        - Exchange
        - CalDAV
        - Local (On My Mac)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic output
      description: Output of `calmirror status --json` and `calmirror logs --limit 20`, redacted as needed.
      render: shell
