# Release automation: pushing a tag `vX.Y.Z` that points at a commit on main
# runs the tests, builds the distributable archive with
# scripts/package-release.sh and opens a DRAFT GitHub release with generated
# notes and the archive attached. A maintainer reviews the notes and
# publishes the draft. See docs/RELEASING.md for the full procedure.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build archive and draft release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
        with:
          # Full history so the tag can be checked against main.
          fetch-depth: 0

      - name: Ensure the tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point at a commit on main. Only main is released."
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Package
        # The script rebuilds in release mode, ad-hoc signs the app bundle and
        # fails if the CLI does not report the version being packaged.
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "CalMirror ${VERSION}" \
            "dist/calmirror-${VERSION}-macos-arm64.tar.gz"
          echo "Draft release created: review and publish it at" \
            "https://github.com/${GITHUB_REPOSITORY}/releases"
